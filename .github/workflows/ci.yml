name: CI

on:
  push:
  pull_request:

jobs:

  tests:

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CI
        shell: pwsh
        run: |
          ./ci.ps1